  name: franc
  namespace: franc
  labels:
    app.kubernetes.io/instance: franc-dev
    app.kubernetes.io/name: franc
spec:
  ports:
    - name: 8080-tcp
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
